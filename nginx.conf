server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: cualquier ruta desconocida sirve index.html para que
    # React Router maneje /home, /pedidos, /admin, etc. al recargar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachea los assets con hash generados por Vite (nombre inmutable).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No cachear el HTML de entrada, para tomar siempre el último build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
